<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Memory - Puzzle Enigma</title>
    <link rel="stylesheet" href="../game-style.css">
    <style>
        .memory-grid {
            display: grid;
            gap: 1rem;
            margin: 2rem auto;
        }

        .memory-grid.grid-4x4 {
            grid-template-columns: repeat(4, 120px);
        }

        .memory-grid.grid-6x4 {
            grid-template-columns: repeat(6, 120px);
        }

        .memory-grid.grid-8x4 {
            grid-template-columns: repeat(8, 120px);
        }

        .memory-card {
            width: 120px;
            height: 120px;
            position: relative;
            cursor: pointer;
            transition: filter 0.3s ease;
        }

        .memory-card:hover:not(.matched) {
            filter: brightness(1.1);
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .memory-card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .memory-card.matched {
            animation: fadeOut 0.6s ease-in-out forwards;
            pointer-events: none;
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
                filter: brightness(1);
            }
            50% {
                opacity: 0.7;
                filter: brightness(1.3);
            }
            100% {
                opacity: 0;
                filter: brightness(0.5);
                visibility: hidden;
            }
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 3rem;
        }

        .card-front {
            background: var(--surface-color);
            transform: rotateY(180deg);
            border: 3px solid rgba(148, 163, 184, 0.3);
        }

        .card-back {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: 3px solid var(--primary-color);
        }

        #message {
            order: -1;
            width: 100%;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .memory-grid.grid-4x4 {
                grid-template-columns: repeat(4, 70px);
            }

            .memory-grid.grid-6x4 {
                grid-template-columns: repeat(6, 55px);
            }

            .memory-grid.grid-8x4 {
                grid-template-columns: repeat(8, 40px);
            }

            .memory-grid {
                gap: 0.5rem;
            }

            .memory-card {
                width: 70px;
                height: 70px;
            }

            .memory-grid.grid-6x4 .memory-card {
                width: 55px;
                height: 55px;
            }

            .memory-grid.grid-8x4 .memory-card {
                width: 40px;
                height: 40px;
            }

            .card-face {
                font-size: 2rem;
            }

            .memory-grid.grid-6x4 .card-face {
                font-size: 1.5rem;
            }

            .memory-grid.grid-8x4 .card-face {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../index.html" class="back-btn">
                <span>←</span> Back to Games
            </a>
            <div class="game-title">
                <h1>🃏 Classic Memory</h1>
            </div>
            <div class="score-info">
                <div class="score-box">
                    <div class="score-label">Moves</div>
                    <div class="score-value" id="moves">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">Matches</div>
                    <div class="score-value" id="matches">0/8</div>
                </div>
            </div>
        </div>

        <div class="instructions">
            <h3>How to Play</h3>
            <p>Click on cards to flip them over. Find matching pairs of emojis. Match all pairs to win!</p>
        </div>

        <div class="controls">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <label for="gridSize" style="font-weight: 600; color: var(--text-color);">Grid Size:</label>
                <select id="gridSize" class="btn" style="padding: 0.75rem 1.5rem; background: var(--surface-color); color: var(--text-color); border: 2px solid var(--primary-color); cursor: pointer;">
                    <option value="4x4">4x4 (8 pairs)</option>
                    <option value="6x4">6x4 (12 pairs)</option>
                    <option value="8x4">8x4 (16 pairs)</option>
                </select>
            </div>
            <button class="btn btn-primary" id="newGameBtn">New Game</button>
            <button class="btn btn-secondary" id="resetBtn">Reset</button>
        </div>

        <div class="game-container">
            <div class="memory-grid" id="gameBoard"></div>
            <div id="message"></div>
        </div>
    </div>

    <script>
        const allEmojis = ['🎮', '🎨', '🎭', '🎪', '🎯', '🎲', '🎸', '🎹', '🎬', '🎤', '🎧', '🎼', '🎺', '🎻', '🎰', '🎳'];
        let gridSize = '4x4';
        let totalPairs = 8;
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let canFlip = true;

        function getGridConfig(size) {
            const configs = {
                '4x4': { cols: 4, rows: 4, pairs: 8 },
                '6x4': { cols: 6, rows: 4, pairs: 12 },
                '8x4': { cols: 8, rows: 4, pairs: 16 }
            };
            return configs[size];
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function createBoard() {
            const config = getGridConfig(gridSize);
            totalPairs = config.pairs;

            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            gameBoard.className = `memory-grid grid-${gridSize}`;

            // Select the required number of emojis for this grid size
            const selectedEmojis = allEmojis.slice(0, totalPairs);
            cards = shuffle([...selectedEmojis, ...selectedEmojis]);

            cards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.dataset.emoji = emoji;
                card.dataset.index = index;
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-face card-back"></div>
                        <div class="card-face card-front">${emoji}</div>
                    </div>
                `;
                card.addEventListener('click', flipCard);
                gameBoard.appendChild(card);
            });
        }

        function flipCard() {
            if (!canFlip) return;
            if (this.classList.contains('flipped')) return;
            if (flippedCards.length >= 2) return;

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            canFlip = false;
            const [card1, card2] = flippedCards;
            const emoji1 = card1.dataset.emoji;
            const emoji2 = card2.dataset.emoji;

            if (emoji1 === emoji2) {
                matchedPairs++;
                document.getElementById('matches').textContent = `${matchedPairs}/${totalPairs}`;

                // Mark cards as matched and remove them
                card1.classList.add('matched');
                card2.classList.add('matched');

                flippedCards = [];
                canFlip = true;

                if (matchedPairs === totalPairs) {
                    setTimeout(() => {
                        showMessage(`🎉 Congratulations! You won in ${moves} moves!`, 'success');
                    }, 500);
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    canFlip = true;
                }, 1000);
            }
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            setTimeout(() => {
                messageEl.className = '';
                messageEl.textContent = '';
            }, 3000);
        }

        function resetGame() {
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            canFlip = true;
            document.getElementById('moves').textContent = '0';
            document.getElementById('matches').textContent = `0/${totalPairs}`;
            document.getElementById('message').textContent = '';
            createBoard();
        }

        document.getElementById('gridSize').addEventListener('change', function(e) {
            gridSize = e.target.value;
            resetGame();
        });

        document.getElementById('newGameBtn').addEventListener('click', resetGame);
        document.getElementById('resetBtn').addEventListener('click', resetGame);

        // Initialize game
        resetGame();
    </script>
</body>
</html>
