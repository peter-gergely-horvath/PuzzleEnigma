<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says - Puzzle Enigma</title>
    <link rel="stylesheet" href="../game-style.css">
    <style>
        .simon-board {
            display: grid;
            grid-template-columns: repeat(2, 150px);
            grid-template-rows: repeat(2, 150px);
            gap: 1rem;
            margin: 2rem auto;
        }

        .simon-button {
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 4px solid rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .simon-button:hover {
            transform: scale(1.05);
        }

        .simon-button.active {
            transform: scale(0.95);
            box-shadow: 0 0 30px currentColor;
            filter: brightness(1.5);
        }

        .simon-red { background-color: #ef4444; }
        .simon-blue { background-color: #3b82f6; }
        .simon-green { background-color: #10b981; }
        .simon-yellow { background-color: #f59e0b; }

        #message {
            order: -1;
            width: 100%;
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .simon-board {
                grid-template-columns: repeat(2, 100px);
                grid-template-rows: repeat(2, 100px);
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../index.html" class="back-btn">
                <span>←</span> Back to Games
            </a>
            <div class="game-title">
                <h1>🎯 Simon Says</h1>
            </div>
            <div class="score-info">
                <div class="score-box">
                    <div class="score-label">Level</div>
                    <div class="score-value" id="level">1</div>
                </div>
                <div class="score-box">
                    <div class="score-label">Best</div>
                    <div class="score-value" id="best">0</div>
                </div>
            </div>
        </div>

        <div class="instructions">
            <h3>How to Play</h3>
            <p>Watch the sequence of colors light up, then repeat the pattern by clicking the buttons in the same order. The sequence gets longer each round!</p>
        </div>

""        <div class="controls">
            <button class="btn btn-primary" id="startBtn">Start Game</button>
            <button class="btn btn-secondary" id="resetBtn" disabled>Reset</button>
        </div>

        <div class="game-container">
            <div class="simon-board">
                <div class="simon-button simon-red" data-color="red"></div>
                <div class="simon-button simon-blue" data-color="blue"></div>
                <div class="simon-button simon-green" data-color="green"></div>
                <div class="simon-button simon-yellow" data-color="yellow"></div>
            </div>
            <div id="message"></div>
        </div>
    </div>

    <script>
        const colors = ['red', 'blue', 'green', 'yellow'];
        let sequence = [];
        let playerSequence = [];
        let level = 1;
        let isPlaying = false;
        let isPlayerTurn = false;
        let bestScore = localStorage.getItem('simonBest') || 0;

        document.getElementById('best').textContent = bestScore;

        const buttons = document.querySelectorAll('.simon-button');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                if (!isPlayerTurn) return;
                const color = button.dataset.color;
                playSound(color);
                activateButton(button);
                playerSequence.push(color);
                checkSequence();
            });
        });

        function activateButton(button) {
            button.classList.add('active');
            setTimeout(() => button.classList.remove('active'), 300);
        }

        function playSound(color) {
            // Create simple beep sounds at different frequencies
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            const frequencies = { red: 329.63, blue: 261.63, green: 392.00, yellow: 440.00 };
            oscillator.frequency.value = frequencies[color];
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }

        function nextRound() {
            level++;
            document.getElementById('level').textContent = level;
            playerSequence = [];
            isPlayerTurn = false;

            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            sequence.push(randomColor);

            setTimeout(() => playSequence(), 1000);
        }

        async function playSequence() {
            showMessage('Watch carefully...', 'success');

            for (let i = 0; i < sequence.length; i++) {
                await new Promise(resolve => setTimeout(resolve, 500));
                const color = sequence[i];
                const button = document.querySelector(`[data-color="${color}"]`);
                activateButton(button);
                playSound(color);
            }

            setTimeout(() => {
                isPlayerTurn = true;
                showMessage('Your turn!', 'success');
            }, 1000);
        }

        function checkSequence() {
            const currentIndex = playerSequence.length - 1;

            if (playerSequence[currentIndex] !== sequence[currentIndex]) {
                gameOver();
                return;
            }

            if (playerSequence.length === sequence.length) {
                isPlayerTurn = false;
                showMessage('Correct! Next level...', 'success');
                setTimeout(() => nextRound(), 1500);
            }
        }

        function gameOver() {
            isPlaying = false;
            isPlayerTurn = false;

            if (level - 1 > bestScore) {
                bestScore = level - 1;
                localStorage.setItem('simonBest', bestScore);
                document.getElementById('best').textContent = bestScore;
                showMessage(`🎉 New Record! Level ${level - 1}`, 'success');
            } else {
                showMessage(`Game Over! You reached level ${level - 1}`, 'error');
            }

            startBtn.textContent = 'Play Again';
            startBtn.disabled = false;
            resetBtn.disabled = false;
        }

        function startGame() {
            isPlaying = true;
            level = 1;
            sequence = [];
            playerSequence = [];
            document.getElementById('level').textContent = level;
            startBtn.disabled = true;
            resetBtn.disabled = false;
            nextRound();
        }

        function resetGame() {
            isPlaying = false;
            isPlayerTurn = false;
            level = 1;
            sequence = [];
            playerSequence = [];
            document.getElementById('level').textContent = '1';
            document.getElementById('message').textContent = '';
            startBtn.textContent = 'Start Game';
            startBtn.disabled = false;
            resetBtn.disabled = true;
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
        }

        startBtn.addEventListener('click', startGame);
        resetBtn.addEventListener('click', resetGame);
    </script>
</body>
</html>
