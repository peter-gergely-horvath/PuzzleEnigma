<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Sequence - Puzzle Enigma</title>
    <link rel="stylesheet" href="../game-style.css">
    <style>
        .color-display {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin: 2rem 0;
            min-height: 100px;
        }

        .color-block {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-out;
        }

        .color-picker {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin: 2rem 0;
        }

        .color-btn {
            width: 100px;
            height: 100px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .color-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px currentColor;
        }

        .color-btn.selected {
            transform: scale(0.95);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .color-block {
                width: 60px;
                height: 60px;
            }

            .color-btn {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../index.html" class="back-btn">
                <span>←</span> Back to Games
            </a>
            <div class="game-title">
                <h1>🎨 Color Sequence</h1>
            </div>
            <div class="score-info">
                <div class="score-box">
                    <div class="score-label">Level</div>
                    <div class="score-value" id="level">1</div>
                </div>
                <div class="score-box">
                    <div class="score-label">Best</div>
                    <div class="score-value" id="best">0</div>
                </div>
            </div>
        </div>

        <div class="instructions">
            <h3>How to Play</h3>
            <p>Memorize the sequence of colors, then recreate it by clicking the colors in the correct order!</p>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startBtn">Start Round</button>
            <button class="btn btn-secondary" id="clearBtn" style="display: none;">Clear</button>
            <button class="btn btn-secondary" id="resetBtn">Reset</button>
        </div>

        <div class="game-container">
            <div class="color-display" id="colorDisplay"></div>
            <div class="color-picker" id="colorPicker" style="display: none;"></div>
            <div id="message"></div>
        </div>
    </div>

    <script>
        const colors = [
            { name: 'red', value: '#ef4444' },
            { name: 'blue', value: '#3b82f6' },
            { name: 'green', value: '#10b981' },
            { name: 'yellow', value: '#f59e0b' },
            { name: 'purple', value: '#a855f7' },
            { name: 'pink', value: '#ec4899' },
            { name: 'orange', value: '#f97316' },
            { name: 'teal', value: '#14b8a6' }
        ];

        let sequence = [];
        let playerSequence = [];
        let level = 1;
        let bestScore = localStorage.getItem('colorBest') || 0;

        document.getElementById('best').textContent = bestScore;

        const colorDisplay = document.getElementById('colorDisplay');
        const colorPicker = document.getElementById('colorPicker');
        const startBtn = document.getElementById('startBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resetBtn = document.getElementById('resetBtn');

        function createColorPicker() {
            colorPicker.innerHTML = '';
            colors.forEach(color => {
                const btn = document.createElement('div');
                btn.className = 'color-btn';
                btn.style.backgroundColor = color.value;
                btn.dataset.color = color.name;
                btn.addEventListener('click', () => selectColor(color));
                colorPicker.appendChild(btn);
            });
        }

        function generateSequence() {
            sequence = [];
            const length = 3 + level;
            for (let i = 0; i < length; i++) {
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                sequence.push(randomColor);
            }
        }

        async function showSequence() {
            startBtn.disabled = true;
            colorPicker.style.display = 'none';
            clearBtn.style.display = 'none';
            playerSequence = [];
            colorDisplay.innerHTML = '';

            generateSequence();

            showMessage(`Memorize the sequence (${sequence.length} colors)...`, 'success');

            await new Promise(resolve => setTimeout(resolve, 1000));

            // Show colors one by one
            for (let i = 0; i < sequence.length; i++) {
                const block = document.createElement('div');
                block.className = 'color-block';
                block.style.backgroundColor = sequence[i].value;
                colorDisplay.appendChild(block);
                await new Promise(resolve => setTimeout(resolve, 800));
            }

            await new Promise(resolve => setTimeout(resolve, 2000));

            // Clear display
            colorDisplay.innerHTML = '';

            showMessage('Now recreate the sequence!', 'success');
            colorPicker.style.display = 'flex';
            clearBtn.style.display = 'inline-block';
        }

        function selectColor(color) {
            playerSequence.push(color);

            const block = document.createElement('div');
            block.className = 'color-block';
            block.style.backgroundColor = color.value;
            colorDisplay.appendChild(block);

            // Flash the button
            const btn = document.querySelector(`[data-color="${color.name}"]`);
            btn.classList.add('selected');
            setTimeout(() => btn.classList.remove('selected'), 200);

            if (playerSequence.length === sequence.length) {
                setTimeout(() => checkSequence(), 500);
            }
        }

        function checkSequence() {
            const correct = playerSequence.every((color, index) =>
                color.name === sequence[index].name
            );

            if (correct) {
                level++;
                document.getElementById('level').textContent = level;

                if (level - 1 > bestScore) {
                    bestScore = level - 1;
                    localStorage.setItem('colorBest', bestScore);
                    document.getElementById('best').textContent = bestScore;
                }

                showMessage('🎉 Perfect sequence! Get ready for the next level...', 'success');
                setTimeout(() => showSequence(), 2000);
            } else {
                showMessage('❌ Wrong sequence! Here was the correct order:', 'error');

                setTimeout(() => {
                    colorDisplay.innerHTML = '';
                    sequence.forEach(color => {
                        const block = document.createElement('div');
                        block.className = 'color-block';
                        block.style.backgroundColor = color.value;
                        colorDisplay.appendChild(block);
                    });

                    colorPicker.style.display = 'none';
                    clearBtn.style.display = 'none';
                    startBtn.disabled = false;
                    startBtn.textContent = 'Try Again';
                }, 1000);
            }
        }

        function clearSelection() {
            playerSequence = [];
            colorDisplay.innerHTML = '';
        }

        function resetGame() {
            level = 1;
            sequence = [];
            playerSequence = [];
            document.getElementById('level').textContent = '1';
            colorDisplay.innerHTML = '';
            colorPicker.style.display = 'none';
            clearBtn.style.display = 'none';
            startBtn.disabled = false;
            startBtn.textContent = 'Start Round';
            document.getElementById('message').textContent = '';
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
        }

        startBtn.addEventListener('click', showSequence);
        clearBtn.addEventListener('click', clearSelection);
        resetBtn.addEventListener('click', resetGame);

        createColorPicker();
    </script>
</body>
</html>
